services:
  postgres:
    image: postgres:15-alpine
    container_name: tasknova-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tasknova_user
      POSTGRES_PASSWORD: tasknova_secure_password
      POSTGRES_DB: tasknova_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasknova_user -d tasknova_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tasknova-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tasknova-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - SECRET_KEY=production-super-secret-key-change-this
      - JWT_SECRET_KEY=production-jwt-super-secret-key-change-this
      - DATABASE_URL=postgresql://tasknova_user:tasknova_secure_password@postgres:5432/tasknova_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://127.0.0.1
      - AUTO_CREATE_DB=true
    ports:
      - "5001:5001"

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tasknova-celery-worker
    restart: unless-stopped
    command: celery -A celery_worker.celery worker --loglevel=info
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      - SECRET_KEY=production-super-secret-key-change-this
      - JWT_SECRET_KEY=production-jwt-super-secret-key-change-this
      - DATABASE_URL=postgresql://tasknova_user:tasknova_secure_password@postgres:5432/tasknova_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tasknova-celery-beat
    restart: unless-stopped
    command: celery -A celery_worker.celery beat --loglevel=info
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      - SECRET_KEY=production-super-secret-key-change-this
      - JWT_SECRET_KEY=production-jwt-super-secret-key-change-this
      - DATABASE_URL=postgresql://tasknova_user:tasknova_secure_password@postgres:5432/tasknova_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:5001/api
    container_name: tasknova-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
