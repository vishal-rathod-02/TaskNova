<svg viewBox="0 0 320 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Vector Tile Gradient -->
    <linearGradient id="brandTileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Nova Spark Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Wordmark Nova Gradient -->
    <linearGradient id="novaWordGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Brand Mark Emblem Tile (64x64) -->
  <g transform="translate(8, 8)">
    <!-- Rounded Emblem Container -->
    <rect width="64" height="64" rx="16" fill="url(#brandTileGrad)"/>
    <rect x="1" y="1" width="62" height="62" rx="15" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>

    <!-- Academic Mortarboard Cap (Top Diamond Facet) -->
    <path d="M32 7L58 19L32 31L6 19L32 7Z" fill="#ffffff" fill-opacity="0.95"/>

    <!-- Cap Lower Foundation Arc -->
    <path d="M14 25V38C14 45 22 51 32 51C42 51 50 45 50 38V25L32 33L14 25Z" fill="#c7d2fe" fill-opacity="0.8"/>

    <!-- Radiant Nova Star -->
    <path d="M32 12L34.4 23L45 25.6L34.4 28L32 39L29.6 28L19 25.6L29.6 23L32 12Z" fill="url(#sparkGrad)"/>

    <!-- Central Spark Core -->
    <circle cx="32" cy="25.6" r="2.8" fill="#ffffff"/>
    <circle cx="32" cy="25.6" r="1.3" fill="#4338ca"/>
  </g>

  <!-- Typography Wordmark -->
  <g transform="translate(86, 0)">
    <!-- TaskNova Main Title -->
    <text x="0" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5" fill="#0f172a">
      Task<tspan fill="url(#novaWordGrad)">Nova</tspan>
    </text>

    <!-- Academic Workplace Tagline -->
    <text x="1" y="65" font-family="'SF Mono', 'Courier New', Courier, monospace" font-size="10.5" font-weight="700" letter-spacing="2" fill="#4f46e5">
      ACADEMIC WORKPLACE
    </text>
  </g>
</svg>
