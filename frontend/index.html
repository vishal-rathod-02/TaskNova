<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TaskNova — Modern Academic & Student Workplace Productivity Suite" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TaskNova" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>TaskNova — Academic & Student Workplace Suite</title>

    <!-- Immediate Theme Initialization: syncs theme with user preference before initial paint -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("tasknova_theme");
          if (stored === "dark" || (!stored && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>

    <style>
      /* Dynamic Theme Variables for Boot Splash */
      :root {
        --splash-bg: #f8fafc;
        --splash-gradient:
          radial-gradient(42% 38% at 22% 18%, rgba(99, 102, 241, .16), transparent 70%),
          radial-gradient(40% 36% at 82% 24%, rgba(168, 85, 247, .12), transparent 70%),
          radial-gradient(46% 42% at 55% 88%, rgba(34, 211, 238, .12), transparent 70%),
          linear-gradient(135deg, #f8fafc 0%, #eef2ff 55%, #f1f5f9 100%);
        --splash-wordmark: linear-gradient(100deg, #1e1b4b 28%, #4f46e5 48%, #1e1b4b 68%);
        --splash-tag: #4f46e5;
        --splash-status: #64748b;
        --splash-typo: #4338ca;
        --splash-track: rgba(203, 213, 225, 0.7);
        --splash-track-shadow: inset 0 1px 2px rgba(0, 0, 0, .08);
        --splash-emblem-bg: linear-gradient(135deg, rgba(255,255,255,.95), rgba(255,255,255,.7) 40%, rgba(199, 210, 254, .8));
        --splash-emblem-shadow: 0 20px 40px -10px rgba(79, 70, 229, .25), inset 0 1px 0 rgba(255,255,255,1);
      }

      html.dark {
        --splash-bg: #0b0f19;
        --splash-gradient:
          radial-gradient(42% 38% at 22% 18%, rgba(99, 102, 241, .38), transparent 70%),
          radial-gradient(40% 36% at 82% 24%, rgba(168, 85, 247, .30), transparent 70%),
          radial-gradient(46% 42% at 55% 88%, rgba(34, 211, 238, .20), transparent 70%),
          linear-gradient(135deg, #151a33 0%, #0b0f19 55%, #1c1440 100%);
        --splash-wordmark: linear-gradient(100deg, #f1f5f9 30%, #a5b4fc 48%, #f1f5f9 62%);
        --splash-tag: rgba(165, 180, 252, .85);
        --splash-status: rgba(148, 163, 184, .9);
        --splash-typo: #c7d2fe;
        --splash-track: rgba(148, 163, 184, .22);
        --splash-track-shadow: inset 0 1px 2px rgba(0, 0, 0, .35);
        --splash-emblem-bg: linear-gradient(135deg, rgba(255,255,255,.55), rgba(255,255,255,.08) 40%, rgba(129, 140, 248, .5));
        --splash-emblem-shadow: 0 24px 60px -12px rgba(99, 102, 241, .55), inset 0 1px 0 rgba(255,255,255,.35);
      }

      /* Premium boot splash: brand-gradient stage + glass emblem + shimmer
         wordmark + easing progress bar. Dismissed with a fade/zoom exit. */
      #boot-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 20px; overflow: hidden; background: var(--splash-bg);
        transition: opacity .55s ease, visibility .55s, background .3s ease;
      }
      #boot-splash::before {
        content: ""; position: absolute; inset: -20%;
        background: var(--splash-gradient);
        animation: nova-bg-drift 9s ease-in-out infinite alternate;
      }
      #boot-splash .nova-orb {
        position: absolute; border-radius: 9999px; filter: blur(46px); opacity: .4;
      }
      html.dark #boot-splash .nova-orb { opacity: .5; }
      #boot-splash .nova-orb-a { width: 220px; height: 220px; left: -70px; top: -60px; background: #4f46e5; animation: nova-float 7s ease-in-out infinite; }
      #boot-splash .nova-orb-b { width: 180px; height: 180px; right: -60px; bottom: -40px; background: #7c3aed; animation: nova-float 8.5s ease-in-out infinite reverse; }
      #boot-splash .nova-stage {
        position: relative; display: flex; flex-direction: column; align-items: center; gap: 20px;
        animation: nova-rise .7s cubic-bezier(.16, 1, .3, 1) both;
      }
      #boot-splash .nova-emblem {
        position: relative; width: 96px; height: 96px;
        border-radius: 26px; padding: 3px;
        background: var(--splash-emblem-bg);
        box-shadow: var(--splash-emblem-shadow);
        animation: nova-hover 3.2s ease-in-out infinite;
      }
      #boot-splash .nova-emblem svg { display: block; width: 100%; height: 100%; border-radius: 23px; }
      #boot-splash .nova-ring {
        position: absolute; inset: -9px; border-radius: 32px;
        border: 2px solid transparent;
        border-top-color: rgba(129, 140, 248, .9); border-right-color: rgba(34, 211, 238, .55);
        animation: nova-spin 1.4s linear infinite;
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      }
      #boot-splash .nova-word {
        font-family: system-ui, -apple-system, sans-serif; text-align: center;
        font-size: 26px; font-weight: 800; letter-spacing: -.01em;
        background: var(--splash-wordmark);
        background-size: 220% 100%;
        -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        animation: nova-shimmer 2.4s linear infinite, nova-rise .7s .08s cubic-bezier(.16, 1, .3, 1) both;
      }
      #boot-splash .nova-tag {
        margin-top: 6px; font-family: ui-monospace, monospace; font-size: 10px; font-weight: 700;
        letter-spacing: .32em; color: var(--splash-tag); text-transform: uppercase;
        animation: nova-rise .7s .14s cubic-bezier(.16, 1, .3, 1) both;
      }
      #boot-splash .nova-loader { width: 148px; animation: nova-rise .7s .2s cubic-bezier(.16, 1, .3, 1) both; }
      #boot-splash .nova-track {
        height: 5px; border-radius: 9999px; overflow: hidden;
        background: var(--splash-track);
        box-shadow: var(--splash-track-shadow);
      }
      #boot-splash .nova-fill {
        height: 100%; width: 34%; border-radius: 9999px;
        background: linear-gradient(90deg, #6366f1, #22d3ee, #a78bfa);
        background-size: 200% 100%;
        box-shadow: 0 0 14px rgba(99, 102, 241, .8);
        animation: nova-fill-slide 1.15s cubic-bezier(.45, 0, .55, 1) infinite, nova-fill-sheen 1.15s linear infinite;
      }
      #boot-splash .nova-status {
        margin-top: 10px; text-align: center; font-family: ui-monospace, monospace;
        font-size: 10px; letter-spacing: .18em; color: var(--splash-status); text-transform: uppercase;
      }
      #boot-splash .nova-typo {
        position: relative; height: 16px; margin-top: 4px; overflow: hidden;
        text-align: center; font-family: system-ui, sans-serif;
        font-size: 12px; font-weight: 600; letter-spacing: .02em; color: var(--splash-typo);
      }
      #boot-splash .nova-typo span {
        position: absolute; inset: 0; opacity: 0;
        animation: nova-typo-cycle 7.5s ease-in-out infinite;
      }
      #boot-splash .nova-typo span:nth-child(1) { animation-delay: 0s; }
      #boot-splash .nova-typo span:nth-child(2) { animation-delay: 1.5s; }
      #boot-splash .nova-typo span:nth-child(3) { animation-delay: 3s; }
      #boot-splash .nova-typo span:nth-child(4) { animation-delay: 4.5s; }
      #boot-splash .nova-typo span:nth-child(5) { animation-delay: 6s; }
      @keyframes nova-typo-cycle {
        0% { opacity: 0; transform: translateY(10px); }
        4%, 16% { opacity: 1; transform: translateY(0); }
        20%, 100% { opacity: 0; transform: translateY(-10px); }
      }
      #boot-splash.boot-done { opacity: 0; visibility: hidden; }
      #boot-splash.boot-done .nova-stage { transform: scale(1.12); filter: blur(6px); transition: transform .55s ease, filter .55s ease; }
      @keyframes nova-spin { to { transform: rotate(360deg); } }
      @keyframes nova-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-26px); } }
      @keyframes nova-bg-drift { from { transform: scale(1) rotate(0deg); } to { transform: scale(1.12) rotate(2deg); } }
      @keyframes nova-hover { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
      @keyframes nova-rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes nova-shimmer { from { background-position: 120% 0; } to { background-position: -120% 0; } }
      @keyframes nova-fill-slide { 0% { margin-left: -34%; } 100% { margin-left: 100%; } }
      @keyframes nova-fill-sheen { from { background-position: 0 0; } to { background-position: 200% 0; } }
      @keyframes nova-blink { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash *, #boot-splash *::before, #boot-splash *::after { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <!-- Standalone Initial Boot Splash Screen (Outside Vue mount container) -->
    <div id="boot-splash" aria-hidden="true">
      <div class="nova-orb nova-orb-a"></div>
      <div class="nova-orb nova-orb-b"></div>
      <div class="nova-stage">
        <div class="nova-emblem">
          <div class="nova-ring"></div>
          <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
              <linearGradient id="bootTile" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#4338ca"/><stop offset="50%" stop-color="#4f46e5"/><stop offset="100%" stop-color="#7c3aed"/>
              </linearGradient>
              <linearGradient id="bootSpark" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#818cf8"/>
              </linearGradient>
            </defs>
            <rect width="64" height="64" rx="16" fill="url(#bootTile)"/>
            <path d="M32 7L58 19L32 31L6 19L32 7Z" fill="#ffffff" fill-opacity="0.95"/>
            <path d="M14 25V38C14 45 22 51 32 51C42 51 50 45 50 38V25L32 33L14 25Z" fill="#c7d2fe" fill-opacity="0.8"/>
            <path d="M32 12L34.4 23L45 25.6L34.4 28L32 39L29.6 28L19 25.6L29.6 23L32 12Z" fill="url(#bootSpark)"/>
            <circle cx="32" cy="25.6" r="2.8" fill="#ffffff"/><circle cx="32" cy="25.6" r="1.3" fill="#4338ca"/>
          </svg>
        </div>
        <div>
          <div class="nova-word">TaskNova</div>
          <div class="nova-tag">Academic Workplace</div>
        </div>
        <div class="nova-loader">
          <div class="nova-track"><div class="nova-fill"></div></div>
          <div class="nova-status">Preparing workspace</div>
          <div class="nova-typo" aria-hidden="true">
            <span>Organizing courses…</span>
            <span>Checking deadlines…</span>
            <span>Compiling digest…</span>
            <span>Syncing task ledger…</span>
            <span>Polishing workspace…</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Vue Mounting Container -->
    <div id="app"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
